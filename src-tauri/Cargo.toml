[package]
name = "lumio-ng-app"
version = "0.1.0"
description = "LumioNG — a fast, table-first MongoDB GUI"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumio_ng_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
mongodb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
futures = "0.3"
rquickjs = { version = "0.9", features = ["loader"] }

# Release profile tuned for a small, self-contained binary (HeidiSQL-like footprint).
# opt-level "s" + LTO + single codegen unit shrink code size; strip drops symbols;
# panic="abort" removes unwinding tables. Tests run on the dev profile (still unwinds).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

