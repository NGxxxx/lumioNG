[package]
name = "lumio-ng-app"
version = "0.5.1"
description = "LumioNG — a fast, table-first MongoDB GUI"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumio_ng_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Pinned below 3.9: 3.9 dropped MongoDB 4.2 (wire version 8) support.
mongodb = "~3.8"
russh = "0.64"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "net", "io-util"] }
futures = "0.3"
rquickjs = { version = "0.14", features = ["loader"] }
sqlparser = "0.63"
csv = "1"
base64 = "0.23"

[dev-dependencies]
# `macros` enables `#[tokio::test]` for the ssh_tunnel in-process server/client tests.
tokio = { version = "1", features = ["macros"] }

# Release profile tuned for a small binary. Keep the default panic="unwind": the script engine
# relies on catch_unwind to survive a QuickJS host panic instead of taking the whole app down.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

